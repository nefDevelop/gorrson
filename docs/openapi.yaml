openapi: 3.0.3
info:
  title: Gorrson API
  description: RSS aggregator API for gorrson with visual feeds and favorites.
  version: 1.2.0
servers:
  - url: http://localhost:8080
    description: Local server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Feed:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        site_url:
          type: string
        feed_url:
          type: string
        category:
          type: string
        last_updated:
          type: string
          format: date-time
    
    Entry:
      type: object
      properties:
        id:
          type: string
        feed_id:
          type: string
        title:
          type: string
        summary:
          type: string
          description: Plain-text snippet of the content.
        content:
          type: string
          description: Full sanitized HTML content.
        url:
          type: string
        image_url:
          type: string
          description: URL of the main image/thumbnail.
        published_at:
          type: string
          format: date-time
        is_read:
          type: boolean
        is_favorite:
          type: boolean

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    RefreshRequest:
      type: object
      required:
        - username
        - refresh_token
      properties:
        username:
          type: string
        refresh_token:
          type: string
    
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    AddFeedRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
    
    UpdateFeedRequest:
      type: object
      properties:
        title:
          type: string
        category:
          type: string

    Stats:
      type: object
      properties:
        total_entries:
          type: integer
        unread_entries:
          type: integer
        total_feeds:
          type: integer
        category_stats:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              count:
                type: integer
        feed_stats:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              count:
                type: integer

    APIKey:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time

    APIKeyResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        api_key:
          type: string
          description: The full API key (user:key). This is only shown once upon creation.

paths:
  /login:
    post:
      summary: User login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /refresh:
    post:
      summary: Refresh access token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New access token generated
  /logout:
    post:
      summary: Terminate session
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Session terminated

  /news:
    get:
      summary: List news entries (max 1 year retention, unless favorite)
      security:
        - bearerAuth: []
      parameters:
        - name: unread
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, favorite]
          description: Use 'favorite' to list only marked items.
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Number of entries to return (max pagination).
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Skip entries for scrolling (offset pagination).
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entry'

  /news/{id}/read:
    put:
      summary: Mark an entry as read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Marked as read

  /news/{id}/favorite:
    put:
      summary: Mark or unmark an entry as favorite
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: favorite
          in: query
          schema:
            type: boolean
            default: true
          description: Set to 'false' to unmark.
      responses:
        '204':
          description: Status updated
  
  /feeds:
    get:
      summary: List all followed feeds
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of feeds
    post:
      summary: Add and sync a new feed
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFeedRequest'
      responses:
        '201':
          description: Feed added

  /feeds/import:
    post:
      summary: Import feeds from an OPML file
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              type: string
              description: Raw OPML XML content
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import started in background
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  count:
                    type: int

  /feeds/export:
    get:
      summary: Export feeds to an OPML file
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OPML file
          content:
            application/xml:
              schema:
                type: string

  /feeds/{id}:
    patch:
      summary: Update feed metadata
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFeedRequest'
      responses:
        '200':
          description: Feed updated
    delete:
      summary: Delete a feed
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Feed deleted
  /proxy:
    get:
      summary: Fetch and cache an external image
      tags: [System]
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
          description: Remote image URL.
      responses:
        '200':
          description: The proxied image content
          content:
            image/*:
              schema:
                type: string
                format: binary

  /news/read-all:
    put:
      summary: Mark all entries as read
      tags: [News]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All entries marked as read

  /news/{id}/content:
    get:
      summary: Get full scraped content of an entry
      tags: [News]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scraped HTML content
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: string

  /categories/{name}:
    put:
      summary: Rename a category across all feeds
      tags: [Feeds]
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: The old category name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: The new category name.
      responses:
        '204':
          description: Category renamed

  /config/export:
    get:
      summary: Export filters and system configuration
      tags: [Config]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: JSON configuration file
          content:
            application/json:
              schema:
                type: object

  /config/import:
    post:
      summary: Import filters and system configuration
      tags: [Config]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Configuration imported

  /filters:
    get:
      summary: List all active content filters
      tags: [Filters]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of filters
    post:
      summary: Add a new content filter
      tags: [Filters]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pattern, action, target]
              properties:
                pattern:
                  type: string
                action:
                  type: string
                  enum: [BLOCK, REPLACE]
                target:
                  type: string
                  enum: [title, content, all]
                replacement:
                  type: string
      responses:
        '201':
          description: Filter created

  /filters/{id}:
    delete:
      summary: Delete a filter
      tags: [Filters]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Filter deleted

  /health:
    get:
      summary: Check system health
      tags: [System]
      responses:
        '200':
          description: System is healthy

  /stats:
    get:
      summary: Get system usage statistics
      tags: [System]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: System statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'

  /api-keys:
    get:
      summary: List all device API keys
      tags: [System]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIKey'
    post:
      summary: Create a new device API key
      tags: [System]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '200':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyResponse'

  /api-keys/{id}:
    delete:
      summary: Revoke an API key
      tags: [System]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: API key revoked

  /backup/export:
    get:
      summary: Export full database backup
      tags: [System]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: SQLite database file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /backup/import:
    post:
      summary: Restore database from backup
      tags: [System]
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Backup restored successfully

  /api/fever:
    get:
      summary: Fever-compatible API endpoint
      tags: [System]
      parameters:
        - name: api_key
          in: query
          required: true
          schema:
            type: string
          description: MD5 hash of 'username:password'.
      responses:
        '200':
          description: Fever response
    post:
      summary: Fever-compatible API endpoint
      tags: [System]
      responses:
        '200':
          description: Fever response
