openapi: 3.0.3
info:
  title: Gorrson API
  description: RSS aggregator API for gorrson with visual feeds and favorites.
  version: 1.2.0
servers:
  - url: http://localhost:8080
    description: Local server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Feed:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        site_url:
          type: string
        feed_url:
          type: string
        category:
          type: string
        last_updated:
          type: string
          format: date-time
    
    Entry:
      type: object
      properties:
        id:
          type: string
        feed_id:
          type: string
        title:
          type: string
        summary:
          type: string
          description: Plain-text snippet of the content.
        content:
          type: string
          description: Full sanitized HTML content.
        url:
          type: string
        image_url:
          type: string
          description: URL of the main image/thumbnail.
        published_at:
          type: string
          format: date-time
        is_read:
          type: boolean
        is_favorite:
          type: boolean

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    RefreshRequest:
      type: object
      required:
        - username
        - refresh_token
      properties:
        username:
          type: string
        refresh_token:
          type: string
    
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    AddFeedRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
    
    UpdateFeedRequest:
      type: object
      properties:
        title:
          type: string
        category:
          type: string

paths:
  /login:
    post:
      summary: User login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /refresh:
    post:
      summary: Refresh access token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New access token generated
  /logout:
    post:
      summary: Terminate session
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Session terminated

  /news:
    get:
      summary: List news entries (max 1 year retention, unless favorite)
      security:
        - bearerAuth: []
      parameters:
        - name: unread
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, favorite]
          description: Use 'favorite' to list only marked items.
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Number of entries to return (max pagination).
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Skip entries for scrolling (offset pagination).
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entry'

  /news/{id}/read:
    put:
      summary: Mark an entry as read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Marked as read

  /news/{id}/favorite:
    put:
      summary: Mark or unmark an entry as favorite
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: favorite
          in: query
          schema:
            type: boolean
            default: true
          description: Set to 'false' to unmark.
      responses:
        '204':
          description: Status updated
  
  /feeds:
    get:
      summary: List all followed feeds
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of feeds
    post:
      summary: Add and sync a new feed
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFeedRequest'
      responses:
        '201':
          description: Feed added

  /feeds/import:
    post:
      summary: Import feeds from an OPML file
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              type: string
              description: Raw OPML XML content
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import started in background
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  count:
                    type: int

  /feeds/export:
    get:
      summary: Export feeds to an OPML file
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OPML file
          content:
            application/xml:
              schema:
                type: string

  /feeds/{id}:
    patch:
      summary: Update feed metadata
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFeedRequest'
      responses:
        '200':
          description: Feed updated
    delete:
      summary: Delete a feed
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Feed deleted
