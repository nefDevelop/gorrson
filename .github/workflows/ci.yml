name: Gorrson CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Sync Dependencies
      run: |
        go mod tidy
        go mod download

    - name: Run Tests
      run: go test -v ./internal/...

    - name: Build Binary
      run: go build -v -o rss-cli main.go

    - name: Verify Binary
      run: ./rss-cli --help
