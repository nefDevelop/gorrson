name: Gorrson Gitea CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test on Gitea
    runs-on: ubuntu-latest # Asegúrate de que tu Gitea runner tenga esta etiqueta o cámbiala por la que uses

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Install Dependencies
      run: go mod download

    - name: Run Tests
      run: go test -v ./internal/...

    - name: Build Binary
      run: go build -v -o rss-cli main.go

    - name: Verify Binary
      run: ./rss-cli --help
